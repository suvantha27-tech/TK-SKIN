<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<title>TK FINAL SYSTEM</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff;display:flex}
.sidebar{width:220px;background:#020617;padding:15px}
.sidebar button{width:100%;padding:10px;margin:5px 0;background:#111827;color:#22c55e;border:none;text-align:left}
.main{flex:1;padding:20px}
input,select{width:100%;padding:8px;margin:5px 0;border-radius:5px;border:none}
button{background:#22c55e;color:#fff;padding:10px;border:none;width:100%;margin-top:5px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #333}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="sidebar">
<h3>TK SYSTEM</h3>
<button onclick="show('invoice')">🧾 Invoice</button>
<button onclick="show('history')">📜 History</button>
<button onclick="show('customer')">👥 Customer</button>
</div>

<div class="main">

<!-- LOGIN -->
<div id="login">
<h3>🔐 Login</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- INVOICE -->
<div id="invoice" style="display:none;">
<h3>🧾 Invoice</h3>

<select id="customerSelect"></select>
<input id="newCustomer" placeholder="បញ្ចូលអតិថិជនថ្មី">

<select id="product">
<option value="Toner-5">Toner $5</option>
<option value="Serum-10">Serum $10</option>
</select>

<input id="qty" type="number" value="1">
<button onclick="add()">Add</button>

<table>
<tr><th>Item</th><th>Qty</th><th>Total</th><th></th></tr>
<tbody id="list"></tbody>
</table>

<div>Total: $<span id="total">0</span></div>

<button onclick="save()">☁️ Save</button>
<button onclick="pdf()">📄 PDF</button>
</div>

<!-- HISTORY -->
<div id="history" style="display:none;">
<h3>📜 History</h3>
<table>
<tr><th>ID</th><th>Customer</th><th>Total</th></tr>
<tbody id="historyList"></tbody>
</table>
</div>

<!-- CUSTOMER -->
<div id="customer" style="display:none;">
<h3>👥 Customer</h3>
<input id="cname" placeholder="Name">
<input id="cphone" placeholder="Phone">
<button onclick="addCustomer()">Add</button>
<ul id="clist"></ul>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔑 CONFIG
const firebaseConfig = {
apiKey: "AIzaSyBvHXAhaN_qdYTizTQconANCrxELgj8A30",
  authDomain: "tk-system-a7eb8.firebaseapp.com",
  projectId: "tk-system-a7eb8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 REGISTER
window.register = async ()=>{
try{
let e=email.value;
let p=pass.value;

if(!e || !p){
alert("បញ្ចូល Email និង Password");
return;
}

await createUserWithEmailAndPassword(auth,e,p);
alert("បង្កើតគណនីរួច!");
}catch(err){
alert(err.message);
}
};

// 🔐 LOGIN
window.login = async ()=>{
try{
await signInWithEmailAndPassword(auth,email.value,pass.value);
login.style.display="none";
show('invoice');
}catch(err){
alert(err.message);
}
};

// NAV
window.show = (p)=>{
["invoice","history","customer"].forEach(id=>{
document.getElementById(id).style.display="none";
});
document.getElementById(p).style.display="block";
};

// INVOICE
let items=[];

window.add = ()=>{
let p=product.value.split("-");
let q=parseInt(qty.value);
items.push({name:p[0],qty:q,total:p[1]*q});
render();
};

function render(){
let html="",sum=0;
items.forEach((i,index)=>{
html+=`<tr>
<td>${i.name}</td>
<td>${i.qty}</td>
<td>$${i.total}</td>
<td><button onclick="del(${index})">❌</button></td>
</tr>`;
sum+=i.total;
});
list.innerHTML=html;
total.innerText=sum;
}

window.del = (i)=>{items.splice(i,1);render();};

// SAVE
window.save = async ()=>{
let id="INV-"+Date.now();

let customer = customerSelect.value;
let newCus = newCustomer.value;

// add new customer
if(newCus){
customer=newCus;
await addDoc(collection(db,"customer"),{
name:newCus,
phone:""
});
}

await addDoc(collection(db,"invoice"),{
id,
customer,
items,
total:parseFloat(total.innerText),
date:new Date()
});

alert("Saved "+id);
items=[];
render();
newCustomer.value="";
};

// PDF
window.pdf = ()=>{
const { jsPDF } = window.jspdf;
let doc=new jsPDF();
doc.text("TK INVOICE",20,20);

let y=30;
items.forEach(i=>{
doc.text(`${i.name} x${i.qty} = $${i.total}`,20,y);
y+=10;
});

doc.text("Total: $"+total.innerText,20,y+10);
doc.save("invoice.pdf");
};

// CUSTOMER LIST
window.addCustomer = ()=>{
addDoc(collection(db,"customer"),{
name:cname.value,
phone:cphone.value
});
};

onSnapshot(collection(db,"customer"), snap=>{
let html="",opt="";
snap.forEach(doc=>{
let d=doc.data();
html+=`<li>${d.name} - ${d.phone}</li>`;
opt+=`<option>${d.name}</option>`;
});
clist.innerHTML=html;
customerSelect.innerHTML=opt;
});

// HISTORY
onSnapshot(collection(db,"invoice"), snap=>{
let html="";
snap.forEach(doc=>{
let d=doc.data();
html+=`<tr>
<td>${d.id}</td>
<td>${d.customer}</td>
<td>$${d.total}</td>
</tr>`;
});
historyList.innerHTML=html;
});

</script>

</body>
</html>
