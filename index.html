<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<title>TK FULL SYSTEM</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{display:flex;background:#0f172a;color:#fff;font-family:Arial;margin:0}
.sidebar{width:200px;background:#020617;padding:15px}
.sidebar button{width:100%;margin:5px 0;padding:10px;background:#111827;color:#22c55e;border:none;text-align:left}
.main{flex:1;padding:20px}
.card{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:10px}
input,select{width:100%;padding:8px;margin:5px 0;border-radius:5px;border:none}
button.action{background:#22c55e;color:#fff}
</style>
</head>

<body>

<div class="sidebar">
<h2>TK</h2>
<button onclick="showPage('dashboard')">🏠 Dashboard</button>
<button onclick="showPage('invoice')">🧾 Invoice</button>
<button onclick="showPage('customers')">👥 Customers</button>
<button onclick="showPage('stock')">📦 Stock</button>
<button onclick="showPage('report')">📊 Report</button>
</div>

<div class="main">

<div id="dashboard">
<h2>Dashboard</h2>
<div class="card">Today: $<span id="today">0</span></div>
<div class="card">Month: $<span id="month">0</span></div>
<div class="card">Year: $<span id="year">0</span></div>
</div>

<div id="invoice" style="display:none;">
<h2>Invoice</h2>
<input id="customer" placeholder="Customer">
<input type="date" id="date">

<select id="product">
<option value="Toner-5">Toner $5</option>
<option value="Serum-10">Serum $10</option>
</select>

<input id="qty" type="number" value="1">
<button class="action" onclick="add()">Add</button>

<table width="100%">
<tr><th>Name</th><th>Qty</th><th>Total</th></tr>
<tbody id="list"></tbody>
</table>

<div>Total: $<span id="total">0</span></div>

<button class="action" onclick="save()">Save</button>
</div>

<div id="customers" style="display:none;">
<h2>Customers</h2>
<input id="custName">
<button onclick="addCustomer()">Save</button>
<ul id="custList"></ul>
</div>

<div id="stock" style="display:none;">
<h2>Stock</h2>
<p>Toner: <span id="toner">50</span></p>
<p>Serum: <span id="serum">50</span></p>
</div>

<div id="report" style="display:none;">
<h2>Report</h2>
<canvas id="chart"></canvas>
</div>

</div>

<script>
function showPage(p){
document.querySelectorAll("#dashboard,#invoice,#customers,#stock,#report")
.forEach(e=>e.style.display="none");
document.getElementById(p).style.display="block";
}

let items=[];
let history=JSON.parse(localStorage.getItem("history"))||[];

function add(){
let p=document.getElementById("product").value.split("-");
let q=parseInt(document.getElementById("qty").value);
items.push({name:p[0],qty:q,total:p[1]*q});
render();
}

function render(){
let html="",sum=0;
items.forEach(i=>{
html+=`<tr><td>${i.name}</td><td>${i.qty}</td><td>$${i.total}</td></tr>`;
sum+=i.total;
});
document.getElementById("list").innerHTML=html;
document.getElementById("total").innerText=sum;
}

function save(){
let total=parseFloat(document.getElementById("total").innerText);
let date=document.getElementById("date").value;
history.push({date,total});
localStorage.setItem("history",JSON.stringify(history));
updateDashboard();
drawChart();
alert("Saved");
}

function updateDashboard(){
let today=0,month=0,year=0;
let now=new Date();
history.forEach(i=>{
let d=new Date(i.date);
if(d.toDateString()==now.toDateString()) today+=i.total;
if(d.getMonth()==now.getMonth()) month+=i.total;
if(d.getFullYear()==now.getFullYear()) year+=i.total;
});
document.getElementById("today").innerText=today;
document.getElementById("month").innerText=month;
document.getElementById("year").innerText=year;
}

function drawChart(){
let months=Array(12).fill(0);
history.forEach(i=>{
let d=new Date(i.date);
months[d.getMonth()]+=i.total;
});
new Chart(document.getElementById("chart"),{
type:'bar',
data:{labels:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
datasets:[{label:'Income',data:months}]}
});
}

updateDashboard();
drawChart();
</script>

</body>
</html>
