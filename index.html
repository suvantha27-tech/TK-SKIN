<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<title>TK CLOUD SYSTEM</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff;display:flex}
.sidebar{width:220px;background:#020617;padding:15px}
.sidebar button{width:100%;padding:10px;margin:5px 0;background:#111827;color:#22c55e;border:none;text-align:left}
.main{flex:1;padding:20px}
input,select{width:100%;padding:8px;margin:5px 0;border-radius:5px;border:none}
button{background:#22c55e;color:#fff;padding:10px;border:none;width:100%;margin-top:5px}
table{width:100%}
</style>
</head>

<body>

<div class="sidebar">
<h3>TK CLOUD</h3>
<button onclick="show('invoice')">🧾 វិក័យប័ត្រ</button>
<button onclick="show('report')">📊 របាយការណ៍</button>
</div>

<div class="main">

<div id="login">
<h3>🔐 ចូលប្រើ</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">ចូល</button>
<button onclick="register()">បង្កើតគណនី</button>
</div>

<div id="invoice" style="display:none;">
<h3>🧾 វិក័យប័ត្រ</h3>

<select id="product">
<option value="Toner-5">Toner $5</option>
<option value="Serum-10">Serum $10</option>
</select>

<input id="qty" type="number" value="1">
<button onclick="add()">បន្ថែម</button>

<table>
<tr><th>ឈ្មោះ</th><th>ចំនួន</th><th>សរុប</th><th></th></tr>
<tbody id="list"></tbody>
</table>

<div>សរុប: $<span id="total">0</span></div>
<button onclick="save()">រក្សាទុកទៅ Cloud</button>
</div>

<div id="report" style="display:none;">
<h3>📊 របាយការណ៍</h3>
<div id="totalCloud">0</div>
</div>

</div>

<script>
// 🔥 REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBvHXAhaN_qdYTizTQconANCrxELgj8A30",
  authDomain: "tk-system-a7eb8.firebaseapp.com",
  projectId: "tk-system-a7eb8"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// LOGIN
function register(){
auth.createUserWithEmailAndPassword(
document.getElementById("email").value,
document.getElementById("pass").value
).then(()=>alert("បង្កើតគណនីរួច"));
}

function login(){
auth.signInWithEmailAndPassword(
document.getElementById("email").value,
document.getElementById("pass").value
).then(()=>{
alert("ចូលជោគជ័យ");
document.getElementById("login").style.display="none";
show('invoice');
});
}

// NAV
function show(p){
document.getElementById("invoice").style.display="none";
document.getElementById("report").style.display="none";
document.getElementById(p).style.display="block";
}

// DATA
let items=[];

function add(){
let p=document.getElementById("product").value.split("-");
let q=parseInt(document.getElementById("qty").value);
items.push({name:p[0],qty:q,total:p[1]*q});
render();
}

function render(){
let html="",sum=0;
items.forEach((i,index)=>{
html+=`<tr>
<td>${i.name}</td>
<td>${i.qty}</td>
<td>$${i.total}</td>
<td><button onclick="del(${index})">❌</button></td>
</tr>`;
sum+=i.total;
});
document.getElementById("list").innerHTML=html;
document.getElementById("total").innerText=sum;
}

function del(i){items.splice(i,1);render();}

// SAVE CLOUD
function save(){
db.collection("invoice").add({
items:items,
total:parseFloat(document.getElementById("total").innerText),
date:new Date()
});
alert("រក្សាទុក Cloud រួច!");
}

// LOAD REPORT
db.collection("invoice").onSnapshot(snap=>{
let total=0;
snap.forEach(doc=>{
total+=doc.data().total;
});
document.getElementById("totalCloud").innerText="Total: $"+total;
});
</script>

</body>
</html>
